name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid PR pushes) to save runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS · Apple Clang · Release"
            os: macos-15
            build_type: Release
            sanitize: "OFF"
            packages: ""
            cmake_extra: ""

          - name: "macOS · Apple Clang · Debug + ASan/UBSan"
            os: macos-15
            build_type: Debug
            sanitize: "ON"
            packages: ""
            cmake_extra: ""

          - name: "Linux · GCC 9 · Release"
            os: ubuntu-22.04
            build_type: Release
            sanitize: "OFF"
            packages: "gcc-9 g++-9"
            cmake_extra: "-DCMAKE_C_COMPILER=gcc-9 -DCMAKE_CXX_COMPILER=g++-9"

          - name: "Linux · GCC 14 · Release"
            os: ubuntu-24.04
            build_type: Release
            sanitize: "OFF"
            packages: "gcc-14 g++-14"
            cmake_extra: "-DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14"

          - name: "Linux · Clang 14 · Release"
            os: ubuntu-22.04
            build_type: Release
            sanitize: "OFF"
            packages: "clang-14"
            cmake_extra: "-DCMAKE_C_COMPILER=clang-14 -DCMAKE_CXX_COMPILER=clang++-14"

          - name: "Linux · Clang 17 · Debug + ASan/UBSan"
            os: ubuntu-24.04
            build_type: Debug
            sanitize: "ON"
            packages: "clang-17"
            cmake_extra: "-DCMAKE_C_COMPILER=clang-17 -DCMAKE_CXX_COMPILER=clang++-17"

          - name: "Linux · Clang 18 · Release"
            os: ubuntu-24.04
            build_type: Release
            sanitize: "OFF"
            packages: "clang-18"
            cmake_extra: "-DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18"

          - name: "Linux · Clang 18 · Debug + TSan"
            os: ubuntu-24.04
            build_type: Debug
            sanitize: "thread"
            packages: "clang-18"
            cmake_extra: "-DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18"

          - name: "Windows · MSVC 2022 · Release"
            os: windows-2022
            build_type: Release
            sanitize: "OFF"
            packages: ""
            cmake_extra: ""

          - name: "Windows · MSVC 2025 · Debug"
            os: windows-2025
            build_type: Debug
            sanitize: "OFF"
            packages: ""
            cmake_extra: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        if: ${{ matrix.packages != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTHORAX_SANITIZE=${{ matrix.sanitize }}
          ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --parallel --config ${{ matrix.build_type }}

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C ${{ matrix.build_type }}

  # Cross-compiler ABI check. thorax's headline promise is that code built with
  # one toolchain interoperates with a libthorax built by another. Build + install
  # thorax with GCC, then build the find_package consumer (a host + a plugin
  # loader) with Clang against that install and run it — the Clang-compiled host
  # calls into a GCC-built libthorax across the THX_API boundary and loads the
  # GCC-built plugins.
  abi-cross-compiler:
    name: "Linux · ABI · GCC libthorax ↔ Clang consumer"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC + Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 clang-18

      - name: Build & install thorax with GCC
        run: |
          cmake -S . -B build-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/_install" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DTHORAX_BUILD_TESTING=OFF -DTHORAX_BUILD_EXAMPLES=OFF
          cmake --build build-host --parallel
          cmake --install build-host

      - name: Build the consumer with Clang against the GCC install
        run: |
          cmake -S test/consumer -B build-consumer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/_install"
          cmake --build build-consumer --parallel

      - name: Run — Clang host loads GCC-built libthorax + plugins
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/_install/lib"
          ./build-consumer/consumer
          ./build-consumer/consumer_plugins "$GITHUB_WORKSPACE/_install/lib/thorax/plugins"

  # Style gate. Runs the project's own `format-check` target, which uses the
  # pinned clang-format vendored by cmake/addclangformat.cmake — the *same*
  # binary developers run locally, so CI and local never disagree on version.
  # Bump the version in that module and reformat the tree in the same commit.
  # Configure with everything but the formatter off so this job pulls only the
  # clang-format binary, not Catch2 / spdlog / httplib.
  format:
    name: "clang-format"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure (formatter only)
        run: >
          cmake -S . -B build
          -DTHORAX_BUILD_TESTING=OFF
          -DTHORAX_BUILD_EXAMPLES=OFF
          -DTHORAX_BUILD_PLUGINS=OFF
          -DTHORAX_INSTALL=OFF

      - name: Check formatting
        run: cmake --build build --target format-check
